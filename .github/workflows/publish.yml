name: Publish to PyPI

# Publishes on a version tag (e.g. v0.1.0) using PyPI Trusted Publishing (OIDC).
# No API tokens are stored: the PyPI project must have this repo + workflow
# configured as a trusted publisher first.
# See: https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - "v*"

# Least privilege: jeder Job hier liest nur den Quelltext. Ohne diesen
# Block erbt der Lauf die Standardrechte der Organisation, die schreibend
# sein koennen (OpenSSF Scorecard TokenPermissionsID, Schweregrad high).
permissions:
  contents: read

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/statepilot/
    permissions:
      id-token: write # REQUIRED for trusted publishing (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
